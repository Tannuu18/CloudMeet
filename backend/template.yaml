AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: CloudMeet classroom MVP - review account allowances before deployment
Parameters:
  FrontendOrigin:
    Type: String
    Description: Exact HTTPS frontend origin, without a trailing slash or path
    AllowedPattern: 'https?://[a-zA-Z0-9.-]+(:[0-9]+)?'
  TokenSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Random HMAC secret, at least 32 characters; never commit it
Resources:
  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1
      Tags:
        - Key: Project
          Value: CloudMeet
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: CloudMeet
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
      UserPoolTags:
        Project: CloudMeet
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
  OrganizerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: organizer
  Api:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs22.x
      Handler: src/handler.handler
      CodeUri: .
      MemorySize: 128
      Timeout: 15
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - !Ref FrontendOrigin
          AllowHeaders:
            - authorization
            - content-type
          AllowMethods:
            - GET
            - POST
            - PATCH
          MaxAge: 600
      Environment:
        Variables:
          EVENTS_TABLE: !Ref EventsTable
          TOKEN_SECRET: !Ref TokenSecret
          COGNITO_USER_POOL_ID: !Ref UserPool
          COGNITO_CLIENT_ID: !Ref UserPoolClient
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Scan
              Resource: !GetAtt EventsTable.Arn
      Tags:
        Project: CloudMeet
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${Api}
      RetentionInDays: 7
      Tags:
        - Key: Project
          Value: CloudMeet
Outputs:
  ApiUrl:
    Value: !GetAtt ApiUrl.FunctionUrl
  UserPoolId:
    Value: !Ref UserPool
  ClientId:
    Value: !Ref UserPoolClient
  TableName:
    Value: !Ref EventsTable
